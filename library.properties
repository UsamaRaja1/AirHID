name=AirHID
version=0.1.0
author=Usama Raja
maintainer=Usama Raja
sentence=Composite Bluetooth Low Energy HID library for ESP32.
paragraph=AirHID creates a single BLE HID device that supports multiple report types including mouse, keyboard, consumer control, system control, and future HID devices over one Bluetooth connection. It features a modular report registry, bonding, passkey pairing, battery service, power-saving support, and is built on NimBLE-Arduino for ESP32 Arduino Core 3.x.
