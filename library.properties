name=AirHID
version=0.1.0
author=AirHID
maintainer=AirHID
sentence=Composite Bluetooth Low Energy HID library for ESP32 — mouse, keyboard, and more over a single connection.
paragraph=One BLE HID device, one pairing, many report types. A generic report registry assembles the composite HID report map and assigns report IDs, so mouse, keyboard, consumer control, system control, and gamepad reports coexist under one connection. Includes bonding, passkey pairing, battery service, idle power saving, and deep sleep support. Requires NimBLE-Arduino 2.4.0+ and ESP32 Arduino Core 3.x.
category=Communication
url=https://github.com/
architectures=esp32
depends=NimBLE-Arduino (>=2.4.0)
